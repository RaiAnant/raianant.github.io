<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Anant Rai - Photography</title>
  <meta name="author" content="Anant Rai">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="icon" type="image/png" href="images/seal_icon.png">
  
  <style>
    /* Navigation styling */
    .nav-header {
      padding: 2.5% 0;
      margin-bottom: 20px;
    }
    
    /* Masonry Grid Layout for varying image sizes */
    .masonry-gallery {
      column-count: 3;
      column-gap: 20px;
      padding: 0 15px;
    }
    
    /* Individual photo item wrapper */
    .gallery-item {
      position: relative;
      margin-bottom: 20px;
      break-inside: avoid; /* Prevents images splitting across columns */
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    
    .gallery-item:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 15px rgba(0,0,0,0.2);
    }
    
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      background-color: #f0f0f0; /* Placeholder color while loading */
    }
    
    /* Dark overlay effect on hover */
    .photo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .gallery-item:hover .photo-overlay {
      opacity: 1;
    }
    
    /* Stylish "View" button inside overlay */
    .view-btn {
      background-color: #ffffff;
      color: #333333;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      pointer-events: none; /* Allows the click to pass through to the main item */
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background-color 0.2s;
    }
    
    /* Large UI Element / Lightbox Modal Styling */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9); /* Dark background behind image */
      display: none; /* Hidden by default */
      justify-content: center;
      align-items: center;
      z-index: 9999; /* Keeps it on top of everything else */
      cursor: zoom-out;
    }
    
    /* Expanded high-res image styling */
    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      animation: zoomIn 0.2s ease-out; /* Smooth transition when opening */
    }
    
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Responsive design for smaller screens */
    @media (max-width: 800px) {
      .masonry-gallery {
        column-count: 2;
      }
    }
    @media (max-width: 500px) {
      .masonry-gallery {
        column-count: 1;
      }
    }
  </style>
</head>

<body>
  <table style="width:100%;max-width:920px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
    <tbody>
      <tr style="padding:0px">
        <td style="padding:0px">
          
          <div class="nav-header" style="padding-left: 20px;">
            <heading>Photography</heading>
            <p>
              <a href="index.html">← Back to Home</a>
            </p>
          </div>

          <div class="masonry-gallery" id="photo-gallery">
            </div>

          <table width="100%" cellpadding="20"><tbody>
            <tr>
              <p style="text-align: right; margin-top: 40px;">
                <a href="https://jonbarron.info/">Template From Here</a>
              </p>
            </tr>
          </tbody></table>

        </td>
      </tr>
    </tbody>
  </table>

  <div class="lightbox-modal" id="lightbox">
    <img class="lightbox-content" id="lightbox-img" src="" alt="Expanded View">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const folderPath = 'images/photography/';
      const photos = [
        { id: '2', width: 638, height: 960 },
        { id: '4', width: 960, height: 522 },
        { id: '6', width: 960, height: 520 },
        { id: '7', width: 960, height: 621 },
        { id: '8', width: 960, height: 668 },
        { id: '9', width: 960, height: 706 },
        { id: '10', width: 960, height: 532 },
        { id: '11', width: 638, height: 960 },
        { id: '12', width: 960, height: 544 },
        { id: '13', width: 638, height: 960 },
        { id: '14', width: 960, height: 638 },
        { id: '15', width: 632, height: 960 },
        { id: '16', width: 638, height: 960 },
        { id: '18', width: 960, height: 627 },
        { id: '19', width: 960, height: 638 },
        { id: '20', width: 960, height: 507 },
        { id: '21', width: 640, height: 960 },
        { id: '22', width: 640, height: 960 },
        { id: '23', width: 960, height: 647 },
        { id: 'dsc-7310', width: 960, height: 627 },
        { id: 'dsc-7459', width: 960, height: 587 },
        { id: 'dsc-7520', width: 960, height: 657 },
        { id: 'dsf0618-lr', width: 960, height: 640 },
        { id: 'dsf0682', width: 960, height: 751 },
        { id: 'dsf0753', width: 640, height: 960 },
        { id: 'dsf0782-2', width: 709, height: 960 },
        { id: 'dsf0801', width: 960, height: 651 },
        { id: 'dsf1054', width: 816, height: 960 },
        { id: 'dsf1528', width: 960, height: 640 },
        { id: 'dsf1913', width: 640, height: 960 },
        { id: 'dsf1964', width: 960, height: 553 },
        { id: 'dsf1991', width: 960, height: 480 },
        { id: 'dsf2017', width: 815, height: 960 },
        { id: 'dsf2018', width: 660, height: 960 },
        { id: 'dsf2031', width: 960, height: 640 },
        { id: 'dsf2128', width: 676, height: 960 },
        { id: 'dsf2137', width: 655, height: 960 },
        { id: 'dsf2156', width: 640, height: 960 },
        { id: 'dsf2164', width: 796, height: 960 },
        { id: 'dsf2299', width: 960, height: 609 },
        { id: 'dsf2324-edit', width: 960, height: 640 },
        { id: 'dsf2389', width: 699, height: 960 },
        { id: 'dsf2398', width: 960, height: 533 },
        { id: 'dsf2585', width: 960, height: 512 },
        { id: 'dsf2688', width: 960, height: 619 },
        { id: 'dsf2767', width: 960, height: 613 },
        { id: 'dsf2828', width: 960, height: 625 }
      ];

      // Randomize shuffle
      for (let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photos[i], photos[j]] = [photos[j], photos[i]];
      }

      // Injecting structural elements into the gallery
      const gallery = document.getElementById('photo-gallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      let lightboxRequest = 0;
      
      photos.forEach((photo, index) => {
        // 1. Create outer card item
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        // 2. Create the image
        const img = document.createElement('img');
        const galleryPath = folderPath + 'gallery/' + photo.id;
        img.src = galleryPath + '-480.avif';
        img.srcset = galleryPath + '-480.avif 480w, ' + galleryPath + '-960.avif 960w';
        img.sizes = '(max-width: 500px) calc(100vw - 30px), (max-width: 800px) calc((100vw - 50px) / 2), 283px';
        img.alt = 'Photograph by Anant Rai';
        img.width = photo.width;
        img.height = photo.height;
        img.decoding = 'async';
        img.loading = index < 3 ? 'eager' : 'lazy';
        if (index === 0) img.fetchPriority = 'high';
        
        // 3. Create the hover overlay block
        const overlay = document.createElement('div');
        overlay.className = 'photo-overlay';
        
        // 4. Create the "View" button inside overlay
        const btn = document.createElement('button');
        btn.className = 'view-btn';
        btn.innerText = 'View';
        
        // Assemble elements
        overlay.appendChild(btn);
        item.appendChild(img);
        item.appendChild(overlay);
        
        // Interaction: Clicking the photo opens the full screen UI element
        item.addEventListener('click', () => {
          const requestId = ++lightboxRequest;
          const fullImage = new Image();

          // Show the already-loaded gallery image while the larger file downloads.
          lightboxImg.src = img.currentSrc || img.src;
          lightboxImg.alt = img.alt;
          lightbox.style.display = 'flex';

          fullImage.addEventListener('load', () => {
            if (requestId === lightboxRequest) {
              lightboxImg.src = fullImage.src;
            }
          });
          fullImage.src = folderPath + 'lightbox/' + photo.id + '.jpg';
        });

        gallery.appendChild(item);
      });

      // Interaction: Clicking outside the image (on the background overlay) closes it
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          lightboxRequest++;
          lightbox.style.display = 'none';
          lightboxImg.src = ''; // Clear image source to save runtime memory
        }
      });
    });
  </script>
</body>
</html>
