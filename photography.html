<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Anant Rai - Photography</title>
  <meta name="author" content="Anant Rai">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="icon" type="image/png" href="images/seal_icon.png">
  
  <style>
    :root {
      --page-bg: #f4f1eb;
      --ink: #1d1b17;
      --muted: #746f66;
      --accent: #b85c36;
      --gallery-gap: clamp(10px, 1.1vw, 18px);
    }

    * {
      box-sizing: border-box;
    }

    body.photography-page {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(184, 92, 54, 0.09), transparent 28rem),
        var(--page-bg);
    }

    body.lightbox-open {
      overflow: hidden;
    }

    .site-shell {
      width: min(1760px, calc(100% - clamp(32px, 7vw, 112px)));
      margin: 0 auto;
    }

    .gallery-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: end;
      padding: clamp(28px, 6vw, 86px) 0 clamp(30px, 5vw, 68px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-bottom: clamp(28px, 5vw, 62px);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .back-link:hover,
    .back-link:focus {
      color: var(--accent);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .gallery-title {
      margin: 0;
      font-size: clamp(48px, 7vw, 104px);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.88;
    }

    .gallery-intro {
      max-width: 560px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.25vw, 20px);
      line-height: 1.55;
    }

    .photo-count {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .photo-count strong {
      color: var(--ink);
      font-size: clamp(30px, 3vw, 46px);
      line-height: 1;
    }

    .gallery-rule {
      grid-column: 1 / -1;
      height: 1px;
      margin-top: 8px;
      background: linear-gradient(90deg, var(--ink), rgba(29, 27, 23, 0.08));
    }

    .masonry-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-flow: dense;
      grid-auto-rows: 8px;
      gap: var(--gallery-gap);
      align-items: start;
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: clamp(8px, 0.8vw, 14px);
      background: #ddd8cf;
      box-shadow: 0 2px 10px rgba(34, 29, 22, 0.08);
      color: inherit;
      cursor: zoom-in;
      text-align: left;
      transform: translateY(0);
      transition: transform 220ms ease, box-shadow 220ms ease;
      animation: reveal 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--delay, 0ms);
    }

    .gallery-item--wide {
      grid-column: span 2;
    }

    .gallery-item::after {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: inherit;
      content: '';
      pointer-events: none;
    }

    .gallery-item:hover {
      z-index: 2;
      box-shadow: 0 16px 34px rgba(34, 29, 22, 0.2);
      transform: translateY(-4px);
    }

    .gallery-item:focus-visible {
      z-index: 3;
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      background-color: #ddd8cf;
      transition: filter 350ms ease, transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gallery-item:hover img,
    .gallery-item:focus-visible img {
      filter: saturate(1.04) contrast(1.02);
      transform: scale(1.015);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: clamp(12px, 1.2vw, 18px);
      background: linear-gradient(180deg, transparent 48%, rgba(12, 11, 9, 0.62));
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    .gallery-item:hover .photo-overlay,
    .gallery-item:focus-visible .photo-overlay {
      opacity: 1;
    }

    .view-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: translateY(5px);
      transition: transform 220ms ease;
    }

    .gallery-item:hover .view-label,
    .gallery-item:focus-visible .view-label {
      transform: translateY(0);
    }

    .site-footer {
      display: flex;
      justify-content: flex-end;
      padding: 42px 0 54px;
    }

    .site-footer a {
      color: var(--muted);
      font-size: 13px;
    }

    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      grid-template-columns: clamp(52px, 7vw, 100px) minmax(0, 1fr) clamp(52px, 7vw, 100px);
      align-items: center;
      padding: 24px 0;
      background: rgba(13, 12, 10, 0.96);
      backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 200ms ease, visibility 200ms ease;
    }

    .lightbox-modal.is-open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-stage {
      grid-column: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: calc(100vh - 96px);
      min-height: 0;
    }

    .lightbox-content {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.46);
    }

    .lightbox-control {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .lightbox-control:hover,
    .lightbox-control:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      transform: scale(1.06);
    }

    .lightbox-prev {
      grid-column: 1;
      justify-self: center;
    }

    .lightbox-next {
      grid-column: 3;
      justify-self: center;
    }

    .lightbox-close {
      position: absolute;
      top: 22px;
      right: 22px;
      font-size: 25px;
      line-height: 1;
    }

    .lightbox-meta {
      position: absolute;
      bottom: 22px;
      left: 50%;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .site-shell {
        width: calc(100% - 28px);
      }

      .gallery-header {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .back-link {
        margin-bottom: 32px;
      }

      .photo-count {
        grid-row: 2;
      }

      .gallery-rule {
        grid-row: 3;
      }

      .masonry-gallery {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }

      .lightbox-modal {
        grid-template-columns: 52px minmax(0, 1fr) 52px;
      }

      .lightbox-control {
        width: 38px;
        height: 38px;
      }
    }

    @media (max-width: 520px) {
      .masonry-gallery {
        grid-template-columns: 1fr;
      }

      .gallery-item--wide {
        grid-column: span 1;
      }

      .lightbox-modal {
        display: flex;
        padding: 64px 14px 70px;
      }

      .lightbox-stage {
        width: 100%;
        height: 100%;
      }

      .lightbox-prev,
      .lightbox-next {
        position: absolute;
        bottom: 18px;
      }

      .lightbox-prev { left: 16px; }
      .lightbox-next { right: 16px; }
      .lightbox-meta { bottom: 29px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-item,
      .gallery-item img,
      .photo-overlay,
      .view-label,
      .lightbox-modal {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>

<body class="photography-page">
  <header class="site-shell gallery-header">
    <div>
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Home</a>
      <p class="eyebrow">Visual journal</p>
      <h1 class="gallery-title">Photography</h1>
      <p class="gallery-intro">A collection of moments in time.</p>
    </div>
    <div class="photo-count" aria-label="Number of photographs">
      <strong id="photo-count">46</strong>
      <span>frames</span>
    </div>
    <div class="gallery-rule" aria-hidden="true"></div>
  </header>

  <main class="site-shell">
    <div class="masonry-gallery" id="photo-gallery"></div>
  </main>

  <footer class="site-shell site-footer">
    <a href="https://jonbarron.info/">Template From Here</a>
  </footer>

  <div class="lightbox-modal" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <button class="lightbox-control lightbox-close" id="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
    <button class="lightbox-control lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photograph">←</button>
    <div class="lightbox-stage" id="lightbox-stage">
      <img class="lightbox-content" id="lightbox-img" alt="">
    </div>
    <button class="lightbox-control lightbox-next" id="lightbox-next" type="button" aria-label="Next photograph">→</button>
    <div class="lightbox-meta" id="lightbox-meta" aria-live="polite"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const folderPath = 'images/photography/';
      const photos = [
        { id: '2', width: 638, height: 960 },
        { id: '4', width: 960, height: 522 },
        { id: '6', width: 960, height: 520 },
        { id: '7', width: 960, height: 622 },
        { id: '8', width: 960, height: 668 },
        { id: '9', width: 960, height: 706 },
        { id: '10', width: 960, height: 532 },
        { id: '11', width: 638, height: 960 },
        { id: '12', width: 960, height: 544 },
        { id: '13', width: 638, height: 960 },
        { id: '14', width: 960, height: 638 },
        { id: '15', width: 632, height: 960 },
        { id: '16', width: 638, height: 960 },
        { id: '18', width: 960, height: 628 },
        { id: '20', width: 960, height: 506 },
        { id: '21', width: 640, height: 960 },
        { id: '22', width: 640, height: 960 },
        { id: '23', width: 960, height: 646 },
        { id: 'dsc-7310', width: 960, height: 628 },
        { id: 'dsc-7459', width: 960, height: 586 },
        { id: 'dsc-7520', width: 960, height: 656 },
        { id: 'dsf0618-lr', width: 960, height: 640 },
        { id: 'dsf0682', width: 960, height: 752 },
        { id: 'dsf0753', width: 640, height: 960 },
        { id: 'dsf0782-2', width: 710, height: 960 },
        { id: 'dsf0801', width: 960, height: 652 },
        { id: 'dsf1054', width: 816, height: 960 },
        { id: 'dsf1528', width: 960, height: 640 },
        { id: 'dsf1913', width: 640, height: 960 },
        { id: 'dsf1964', width: 960, height: 554 },
        { id: 'dsf1991', width: 960, height: 480 },
        { id: 'dsf2017', width: 814, height: 960 },
        { id: 'dsf2018', width: 660, height: 960 },
        { id: 'dsf2031', width: 960, height: 640 },
        { id: 'dsf2128', width: 676, height: 960 },
        { id: 'dsf2137', width: 654, height: 960 },
        { id: 'dsf2156', width: 640, height: 960 },
        { id: 'dsf2164', width: 796, height: 960 },
        { id: 'dsf2299', width: 960, height: 608 },
        { id: 'dsf2324-edit', width: 960, height: 640 },
        { id: 'dsf2389', width: 700, height: 960 },
        { id: 'dsf2398', width: 960, height: 532 },
        { id: 'dsf2585', width: 960, height: 512 },
        { id: 'dsf2688', width: 960, height: 618 },
        { id: 'dsf2767', width: 960, height: 612 },
        { id: 'dsf2828', width: 960, height: 624 }
      ];

      // Shuffle on each visit while retaining true row-first visual flow.
      for (let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photos[i], photos[j]] = [photos[j], photos[i]];
      }

      const gallery = document.getElementById('photo-gallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxStage = document.getElementById('lightbox-stage');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxMeta = document.getElementById('lightbox-meta');
      const closeButton = document.getElementById('lightbox-close');
      const previousButton = document.getElementById('lightbox-prev');
      const nextButton = document.getElementById('lightbox-next');
      const galleryItems = [];
      const galleryImages = new Map();
      let lightboxRequest = 0;
      let activeIndex = -1;
      let previousFocus = null;

      document.getElementById('photo-count').textContent = photos.length;

      function resizeItem(item) {
        const styles = window.getComputedStyle(gallery);
        const rowHeight = parseFloat(styles.gridAutoRows);
        const rowGap = parseFloat(styles.rowGap);
        const renderedHeight = item.getBoundingClientRect().width * Number(item.dataset.ratio);
        const rowSpan = Math.ceil((renderedHeight + rowGap) / (rowHeight + rowGap));
        item.style.gridRowEnd = 'span ' + rowSpan;
      }

      function layoutGallery() {
        galleryItems.forEach(resizeItem);
      }

      function showPhoto(index) {
        activeIndex = (index + photos.length) % photos.length;
        const photo = photos[activeIndex];
        const preview = galleryImages.get(photo.id);
        const requestId = ++lightboxRequest;
        const fullImage = new Image();

        lightboxImg.src = preview.currentSrc || preview.src;
        lightboxImg.alt = preview.alt;
        lightboxMeta.textContent = (activeIndex + 1) + ' / ' + photos.length;

        fullImage.decoding = 'async';
        fullImage.addEventListener('load', () => {
          if (requestId === lightboxRequest) {
            lightboxImg.src = fullImage.src;
          }
        });
        fullImage.src = folderPath + 'lightbox/' + photo.id + '.jpg';
      }

      function openLightbox(index) {
        previousFocus = document.activeElement;
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lightbox-open');
        showPhoto(index);
        closeButton.focus({ preventScroll: true });
      }

      function closeLightbox() {
        lightboxRequest++;
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('lightbox-open');
        lightboxImg.src = '';
        if (previousFocus) previousFocus.focus({ preventScroll: true });
      }

      photos.forEach((photo, index) => {
        const item = document.createElement('button');
        const isWide = photo.width / photo.height >= 1.55;

        item.type = 'button';
        item.className = 'gallery-item';
        item.dataset.ratio = photo.height / photo.width;
        item.setAttribute('aria-label', 'Open photograph ' + (index + 1) + ' of ' + photos.length);
        item.style.setProperty('--delay', Math.min(index * 24, 480) + 'ms');
        if (isWide) item.classList.add('gallery-item--wide');

        const img = document.createElement('img');
        const galleryPath = folderPath + 'gallery/' + photo.id;
        img.src = galleryPath + '-480.avif';
        img.srcset = galleryPath + '-480.avif 480w, ' + galleryPath + '-960.avif 960w';
        img.sizes = isWide
          ? '(max-width: 520px) calc(100vw - 28px), (max-width: 1000px) calc(66vw - 28px), 560px'
          : '(max-width: 520px) calc(100vw - 28px), (max-width: 1000px) calc(33vw - 20px), 280px';
        img.alt = 'Photograph ' + (index + 1) + ' by Anant Rai';
        img.width = photo.width;
        img.height = photo.height;
        img.decoding = 'async';
        img.loading = index < 8 ? 'eager' : 'lazy';
        if (index === 0) img.fetchPriority = 'high';

        const overlay = document.createElement('div');
        overlay.className = 'photo-overlay';

        const viewLabel = document.createElement('span');
        viewLabel.className = 'view-label';
        viewLabel.innerHTML = '<span aria-hidden="true">↗</span> View';

        overlay.appendChild(viewLabel);
        item.appendChild(img);
        item.appendChild(overlay);
        gallery.appendChild(item);

        galleryItems.push(item);
        galleryImages.set(photo.id, img);
        item.addEventListener('click', () => openLightbox(index));
        img.addEventListener('load', () => resizeItem(item), { once: true });
      });

      let lastGalleryWidth = 0;
      if ('ResizeObserver' in window) {
        const galleryObserver = new ResizeObserver(entries => {
          const width = entries[0].contentRect.width;
          if (Math.abs(width - lastGalleryWidth) > 0.5) {
            lastGalleryWidth = width;
            window.requestAnimationFrame(layoutGallery);
          }
        });
        galleryObserver.observe(gallery);
      } else {
        window.addEventListener('resize', layoutGallery);
      }
      window.requestAnimationFrame(layoutGallery);

      closeButton.addEventListener('click', closeLightbox);
      previousButton.addEventListener('click', () => showPhoto(activeIndex - 1));
      nextButton.addEventListener('click', () => showPhoto(activeIndex + 1));

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox || event.target === lightboxStage) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', event => {
        if (!lightbox.classList.contains('is-open')) return;
        if (event.key === 'Escape') closeLightbox();
        if (event.key === 'ArrowLeft') showPhoto(activeIndex - 1);
        if (event.key === 'ArrowRight') showPhoto(activeIndex + 1);
      });
    });
  </script>
</body>
</html>
